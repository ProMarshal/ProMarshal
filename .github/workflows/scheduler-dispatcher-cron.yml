name: Scheduler Dispatcher Tick

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-scheduler-dispatcher:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger Scheduler Dispatcher Tick
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.BACKEND_URL }}/api/cron/tick" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" -ne 200 ]; then
            echo "Error: scheduler dispatcher tick failed with status $http_code"
            exit 1
          fi

          echo "Scheduler dispatcher tick triggered successfully"
